<!DOCTYPE html>
<html>
<head>
  <title>Click Me Game</title>
  <style>
    .output {
      width: 500px;
      height: 500px;
      border: 1px solid black;
      margin: auto;
      text-align: center;
      position: relative;
    }
    .box {
      width: 50px;
      height: 50px;
      position: relative;
      top: 50px;
      left: 20%;
      background-color: red;
    }
    .message {
      text-align: center;
      padding: 10px;
      font-size: 1.3em;
    }
  </style>
</head>
<body>
  <div class="output"></div>
  <div class="message"></div>
  <script>
    let out = document.querySelector(".output");
    let message = document.querySelector(".message");
    let instruction = document.createElement("div");
    let box = document.createElement("div");
    let time = {
      start: undefined,
      end: undefined,
      diff: [],
    }
    function randomNum(a = 0, b = 1) {
      return Math.floor(Math.random() * b + 1 * a);
    }
    function showRes() {
      box.style.visibility = "hidden";
      btnStrt.disabled = "";
      for (let i = 0; i < time.diff.length; i += 1){
        instruction.textContent += `
        ${i+1}: ${time.diff[i]}`;
      }
      instruction.textContent += "Нажми Play что бы попробовать еще раз";
      time.diff = [];
    }
    function restart() {
      instruction.textContent = "Начинай кликать";
    }
    function boxSpawner() {
      console.log(box.style.position);
      box.style.position = "absolute";
      box.style.visibility = "";
      let rectOut = out.getBoundingClientRect();
      box.style.left = randomNum(0, 400) + "px";
      box.style.top = randomNum(0, 400) + "px";
      console.log(rectOut.width, rectOut.height, rectOut)
      time.start = Date.now();
    }
    box.style.visibility = "hidden";
    box.classList.add("box");
    box.style.height = "100px";
    box.style.width = "100px";
    box.style.backgroundColor = "red";
    instruction.textContent = "Что бы проверить совю реакцию нажми на кнопку";
    let btnStrt = document.createElement("input");
    btnStrt.type = "button";
    btnStrt.value = "Play";
    out.appendChild(box);
    message.appendChild(instruction);
    message.appendChild(btnStrt);

    btnStrt.addEventListener("click", () => {
      instruction.textContent = ";"
     boxSpawner();
     event.target.disabled = "false";
     let id = setTimeout(() => {
      showRes();
     }, 10000);
    })
    document.addEventListener("click", (e) => {
      if(e.target.className !== "box") return;
      boxSpawner();
    });
    document.addEventListener("mousedown", (e) => {
      if(e.target.className !== "box") return;
      time.end = Date.now();
      time.diff.push((time.end - time.start) / 1000);
      console.log(time.diff);
    })
    
  </script>
</body>
</html>
