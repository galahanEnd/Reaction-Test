<!DOCTYPE html>
<html>
<head>
  <title>Click Me Game</title>
  <style>
    .output {
      width: 500px;
      height: 500px;
      border: 1px solid black;
      margin: auto;
      text-align: center;
    }
    .box {
      width: 50px;
      height: 50px;
      position: relative;
      top: 50px;
      left: 20%;
      background-color: red;
    }
    .message {
      text-align: center;
      padding: 10px;
      font-size: 1.3em;
    }
  </style>
</head>
<body>
  <div class="output"></div>
  <div class="message"></div>
  <script>
    let out = document.querySelector(".output");
    let message = document.querySelector(".message");
    let instruction = document.createElement("div");
    let box = document.createElement("div");
    let time = {
      start: undefined,
      end: undefined,
      diff: undefined,
    }
    box.classList.add("box");
    box.style.height = "100px";
    box.style.width = "100px";
    box.style.display = "none";
    instruction.textContent = "Что бы проверить совю реакцию нажми на кнопку";
    let btnStrt = document.createElement("input");
    btnStrt.type = "button";
    btnStrt.value = "Play";
    out.appendChild(box);
    message.appendChild(instruction);
    message.appendChild(btnStrt);
    
  </script>
</body>
</html>
